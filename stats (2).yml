name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # roda uma vez por dia à meia-noite
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=duartexz-dev&show_icons=true&bg_color=0D1117&title_color=3ea6ff&icon_color=3ea6ff&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=duartexz-dev&layout=compact&langs_count=6&bg_color=0D1117&title_color=3ea6ff&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Code.Flow
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=duartexz-dev&repo=Code.Flow&bg_color=0D1117&title_color=3ea6ff&text_color=ffffff
          path: profile/pin-codeflow.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - NexusPay
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=duartexz-dev&repo=NexusPay&bg_color=0D1117&title_color=3ea6ff&text_color=ffffff
          path: profile/pin-nexuspay.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Focus
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=duartexz-dev&repo=Focus&bg_color=0D1117&title_color=3ea6ff&text_color=ffffff
          path: profile/pin-focus.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
