<svg width="940" height="230" viewBox="0 0 940 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="940" height="230" rx="12" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <path d="M 0 0 H 940 V 34 H 0 Z" fill="#0A0F1D" rx="12"/>
  <rect y="22" width="940" height="12" fill="#0A0F1D"/>
  <line x1="0" y1="34" x2="940" y2="34" stroke="#1E293B" stroke-width="1"/>

  <circle cx="28" cy="17" r="4.5" fill="#EF4444"/>
  <circle cx="44" cy="17" r="4.5" fill="#F59E0B"/>
  <circle cx="60" cy="17" r="4.5" fill="#10B981"/>

  <text x="84" y="21" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    bash — duarte@duarte-os: ~/system/profile (telemetry.sh)
  </text>

  <!-- Command Input Line -->
  <text x="24" y="58" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700">
    duarte@system:~$ <tspan fill="#F8FAFC">./arthur --profile --telemetry</tspan>
  </text>

  <!-- Loaded Modules Output -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="12" transform="translate(24, 72)">
    <!-- Column 1 -->
    <g transform="translate(0, 18)">
      <text x="0" y="0" fill="#34D399" font-weight="700" filter="url(#glowGreen)">[OK]</text>
      <text x="45" y="0" fill="#F1F5F9">JavaScript Core (ES6+ Engine)</text>
    </g>

    <g transform="translate(0, 40)">
      <text x="0" y="0" fill="#34D399" font-weight="700" filter="url(#glowGreen)">[OK]</text>
      <text x="45" y="0" fill="#F1F5F9">React.js (Modular UI Systems)</text>
    </g>

    <g transform="translate(0, 62)">
      <text x="0" y="0" fill="#34D399" font-weight="700" filter="url(#glowGreen)">[OK]</text>
      <text x="45" y="0" fill="#F1F5F9">REST APIs &amp; JSON Stream</text>
    </g>

    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#34D399" font-weight="700" filter="url(#glowGreen)">[OK]</text>
      <text x="45" y="0" fill="#F1F5F9">Git &amp; GitHub Workflows</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(460, 18)">
      <text x="0" y="0" fill="#F59E0B" font-weight="700">[LOAD]</text>
      <text x="60" y="0" fill="#CBD5E1">Python (Automações &amp; Scripts)</text>
    </g>

    <g transform="translate(460, 40)">
      <text x="0" y="0" fill="#F59E0B" font-weight="700">[LOAD]</text>
      <text x="60" y="0" fill="#CBD5E1">Node.js (Backend Runtime)</text>
    </g>

    <g transform="translate(460, 62)">
      <text x="0" y="0" fill="#F59E0B" font-weight="700">[LOAD]</text>
      <text x="60" y="0" fill="#CBD5E1">Databases &amp; Data Modeling</text>
    </g>

    <g transform="translate(460, 84)">
      <text x="0" y="0" fill="#A78BFA" font-weight="700">[TARGET]</text>
      <text x="75" y="0" fill="#E2E8F0">Software Engineering State 🚀</text>
    </g>
  </g>

  <!-- Console Footer Line -->
  <line x1="24" y1="184" x2="916" y2="184" stroke="#1E293B" stroke-width="1"/>
  <text x="24" y="206" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
    [SYSTEM TELEMETRY READY] :: 4 MODULES ACTIVE // 3 IN PIPELINE // 0 CRITICAL FAILURES
  </text>
</svg>
