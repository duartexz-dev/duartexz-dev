<svg width="940" height="300" viewBox="0 0 940 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark OS Deep Space Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="40%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Subtle Slate Gradient -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="940" height="300" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="940" height="300" rx="16" fill="url(#techGrid)"/>

  <!-- Subtle Deep Space Particle Accents -->
  <g opacity="0.45">
    <circle cx="120" cy="50" r="1" fill="#38BDF8"/>
    <circle cx="280" cy="80" r="1.5" fill="#818CF8"/>
    <circle cx="450" cy="35" r="1" fill="#00F0FF"/>
    <circle cx="720" cy="65" r="1.2" fill="#A78BFA"/>
    <circle cx="860" cy="40" r="1" fill="#38BDF8"/>
    <circle cx="180" cy="240" r="1" fill="#818CF8"/>
    <circle cx="680" cy="250" r="1.5" fill="#00F0FF"/>
  </g>

  <!-- Top HUD Bar & Window Controls -->
  <path d="M 24 0 L 260 0 L 280 22 L 660 22 L 680 0 L 916 0" stroke="url(#cyanAccent)" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <circle cx="40" cy="36" r="5" fill="#EF4444"/>
  <circle cx="56" cy="36" r="5" fill="#F59E0B"/>
  <circle cx="72" cy="36" r="5" fill="#10B981"/>

  <text x="100" y="40" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    DUARTE.DEV // SYSTEM OS v3.5
  </text>

  <!-- Right Online Telemetry Badge -->
  <rect x="764" y="24" width="140" height="24" rx="4" fill="#09101F" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="780" cy="36" r="3.5" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="794" y="41" fill="#00F0FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
    SYSTEM ONLINE
  </text>

  <!-- Main Divider -->
  <line x1="24" y1="60" x2="916" y2="60" stroke="#1E293B" stroke-width="1"/>

  <!-- Center Title & System Core Tagline -->
  <text x="44" y="118" fill="#F8FAFC" font-family="'JetBrains Mono', Consolas, monospace" font-size="38" font-weight="800" letter-spacing="2">
    ARTHUR DUARTE
  </text>

  <text x="46" y="148" fill="url(#cyanAccent)" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.2" filter="url(#glow)">
    // SOFTWARE ENGINEERING STUDENT &amp; SYSTEM DEVELOPER
  </text>

  <!-- Console Execution Output Bar -->
  <g transform="translate(44, 172)">
    <rect width="852" height="42" rx="6" fill="#080E1C" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="26" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      duarte@system:~$ <tspan fill="#F1F5F9">exec --mode building --target software-engineer --stack [JS, React, Python, APIs]</tspan>
    </text>
    <rect x="785" y="12" width="8" height="18" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD Telemetry Stats Bar -->
  <g transform="translate(44, 238)">
    <text x="0" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      START: <tspan fill="#38BDF8">JUN/2025</tspan>
    </text>
    <text x="170" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      TARGET: <tspan fill="#A78BFA">SOFTWARE ENGINEER</tspan>
    </text>
    <text x="410" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      METHOD: <tspan fill="#34D399">BUILDING REAL SYSTEMS</tspan>
    </text>
    <text x="700" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      REGION: <tspan fill="#F59E0B">BRASIL 🇧🇷</tspan>
    </text>
  </g>

  <!-- HUD Corner Bracket Accents -->
  <path d="M 24 286 L 44 286" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 24 266 L 24 286" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 916 286 L 896 286" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 916 266 L 916 286" stroke="#00F0FF" stroke-width="2"/>
</svg>