<svg width="940" height="24" viewBox="0 0 940 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowDiv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="20" y1="12" x2="920" y2="12" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#glowDiv)"/>
  <rect x="450" y="6" width="40" height="12" rx="3" fill="#060A14" stroke="#00F0FF" stroke-width="1"/>
  <circle cx="470" cy="12" r="2.5" fill="#00F0FF" filter="url(#glowDiv)"/>
</svg>
